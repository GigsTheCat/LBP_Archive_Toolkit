name: Build and Release WPF App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Build and Publish the App
      shell: pwsh
      run: |
        $rawVersion = "${{ github.event.inputs.version }}"
        $cleanVersion = $rawVersion.TrimStart('v', 'V')
        dotnet publish -c Release -r win-x64 -o ./AppOutput /p:Version=$cleanVersion

    - name: Zip the Output
      shell: pwsh
      
      run: Compress-Archive -Path ./AppOutput/* -DestinationPath "./LbpArchiveToolkit-${{ github.event.inputs.version }}.zip"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: Release ${{ github.event.inputs.version }}
        draft: false
        prerelease: false
        files: "./LbpArchiveToolkit-${{ github.event.inputs.version }}.zip"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
