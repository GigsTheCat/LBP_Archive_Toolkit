name: Build and Release WPF App

on:
  workflow_dispatch:
    inputs:
      patch_notes:
        description: 'Patch notes for this release (Markdown supported)'
        required: false
        type: string

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '11.0.x'
        dotnet-quality: 'preview'

    - name: Extract Version from csproj
      id: get_version
      shell: pwsh
      run: |
        # Read the csproj file as XML and extract the Version property
        $xml = [xml](Get-Content ./LbpArchiveToolkit.csproj)
        $version = $xml.Project.PropertyGroup.Version
        
        if (-not $version) { 
            Write-Error "Version tag not found in LbpArchiveToolkit.csproj"
            exit 1 
        }
        
        Write-Host "Found version: $version"
        
        # Save variables to the GitHub Environment for later steps to use
        Write-Output "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
        Write-Output "TAG_NAME=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Format Patch Notes
      shell: pwsh
      env:
        RAW_NOTES: ${{ inputs.patch_notes }}
      run: |
        # Check if the notes are empty
        if ([string]::IsNullOrWhiteSpace($env:RAW_NOTES)) {
            $formatted = ""
        } else {
            # Replace literal "\n" or "|" with actual newlines
            $raw = $env:RAW_NOTES -replace "\\n", "`n" -replace "\|", "`n"
            
            # Split by newlines, ignore empty lines, and prepend "- " to each
            $lines = $raw -split "`r?`n"
            $formatted = $lines | Where-Object { $_.Trim() -ne "" } | ForEach-Object { "- $($_.Trim())" }
            $formatted = $formatted -join "`n"
        }
        
        # Save the multiline string to the GitHub Environment
        $eof = "EOF_$([guid]::NewGuid().ToString('N'))"
        Add-Content -Path $env:GITHUB_ENV -Value "FORMATTED_PATCH_NOTES<<$eof"
        Add-Content -Path $env:GITHUB_ENV -Value $formatted
        Add-Content -Path $env:GITHUB_ENV -Value $eof

    - name: Build and Publish the App
      shell: pwsh
      run: |
        # Use the extracted version for the publish command
        dotnet publish -c Release -r win-x64 -o ./AppOutput /p:Version=${{ env.APP_VERSION }}

    - name: Zip the Output
      shell: pwsh
      run: Compress-Archive -Path ./AppOutput/* -DestinationPath "./LbpArchiveToolkit-${{ env.TAG_NAME }}.zip"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: Release ${{ env.TAG_NAME }}
        body: ${{ env.FORMATTED_PATCH_NOTES }}
        draft: false
        prerelease: false
        files: "./LbpArchiveToolkit-${{ env.TAG_NAME }}.zip"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}